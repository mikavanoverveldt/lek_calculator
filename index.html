<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albania Currency Calculator</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface-2: #f0efe9;
    --text-primary: #1a1a18; --text-secondary: #6b6b65; --text-tertiary: #9e9e97;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --success-bg: #eaf3de; --success-text: #3b6d11; --success-border: rgba(59,109,17,0.25);
    --accent: #3b6d11; --radius: 10px; --radius-sm: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --surface: #242422; --surface-2: #2c2c2a;
      --text-primary: #f0efe9; --text-secondary: #a0a09a; --text-tertiary: #6b6b65;
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);
      --success-bg: #173404; --success-text: #c0dd97; --success-border: rgba(192,221,151,0.2);
      --accent: #97c459;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text-primary);
    min-height: 100vh; display: flex; align-items: flex-start;
    justify-content: center; padding: 2rem 1rem;
  }
  .card {
    background: var(--surface); border-radius: var(--radius);
    border: 0.5px solid var(--border-strong); padding: 1.75rem;
    width: 100%; max-width: 480px;
  }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.5rem; }
  .flag { font-size: 22px; }
  .header-text h1 { font-size: 16px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
  .header-text p { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
  .divider { height: 0.5px; background: var(--border); margin: 1.25rem 0; }
  .section-label { font-size: 11px; color: var(--text-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field-row > label { font-size: 14px; color: var(--text-secondary); flex: 1; }
  .label-wrap label { font-size: 14px; color: var(--text-secondary); }
  .label-wrap { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .label-meta { font-size: 11px; color: var(--text-tertiary); min-height: 15px; }
  .input-group { display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    width: 30px; height: 30px; border: 0.5px solid var(--border-strong);
    border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-secondary);
    font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .refresh-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .refresh-btn:disabled { opacity: 0.6; cursor: wait; }
  .field-row input {
    width: 110px; padding: 7px 10px; font-size: 15px; font-weight: 500;
    color: var(--text-primary); background: var(--surface-2);
    border: 0.5px solid var(--border-strong); border-radius: var(--radius-sm);
    text-align: right; outline: none; transition: border-color 0.15s;
  }
  .field-row input:focus { border-color: var(--accent); }
  .field-row .unit { font-size: 12px; color: var(--text-tertiary); width: 38px; }
  .results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 0.25rem; }
  .result-card { background: var(--surface-2); border-radius: var(--radius-sm); border: 0.5px solid var(--border); padding: 12px 14px; }
  .result-card.winner { background: var(--success-bg); border-color: var(--success-border); }
  .r-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .result-card.winner .r-label { color: var(--success-text); }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: var(--success-bg); color: var(--success-text); border: 0.5px solid var(--success-border); font-weight: 600; }
  .r-amount { font-size: 18px; font-weight: 600; color: var(--text-primary); line-height: 1.2; }
  .result-card.winner .r-amount { color: var(--success-text); }
  .r-note { font-size: 11px; color: var(--text-tertiary); margin-top: 3px; line-height: 1.5; }
  .result-card.winner .r-note { color: var(--success-text); opacity: 0.8; }
  .diff-bar { margin-top: 12px; padding: 10px 14px; background: var(--surface-2); border-radius: var(--radius-sm); font-size: 13px; color: var(--text-secondary); text-align: center; min-height: 36px; display: flex; align-items: center; justify-content: center; }
  .hint { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; text-align: center; min-height: 16px; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { opacity: 0.4; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <span class="flag">🇦🇱</span>
    <div class="header-text">
      <h1>Albania Currency Calculator</h1>
      <p>Exchange office vs Revolut vs ABN AMRO studentenrekening</p>
    </div>
  </div>

  <p class="section-label">Amount to convert</p>
  <div class="field-row"><label>Euros</label><input type="number" id="euros" value="100" min="1" step="10"><span class="unit">EUR</span></div>
  <div class="field-row"><label>Revolut used this month</label><input type="number" id="revolut-used" value="0" min="0" step="10"><span class="unit">EUR</span></div>

  <div class="divider"></div>
  <p class="section-label">Exchange office</p>
  <div class="field-row"><label>Their rate</label><input type="number" id="exchange-rate" value="93" min="50" step="0.5"><span class="unit">ALL/€</span></div>

  <div class="divider"></div>
  <p class="section-label">Bank rate</p>
  <div class="field-row">
    <div class="label-wrap">
      <label for="bank-rate">Current rate</label>
      <span class="label-meta" id="bank-rate-updated">Not queried yet</span>
    </div>
    <div class="input-group">
      <button type="button" class="refresh-btn" id="refresh-bank-rate" aria-label="Refresh bank rate" title="Refresh bank rate">↻</button>
      <input type="number" id="bank-rate" value="95.5" min="50" step="0.5">
      <span class="unit">ALL/€</span>
    </div>
  </div>

  <div class="divider"></div>
  <p class="section-label">ATM fee (charged by Albanian ATM)</p>
  <div class="field-row"><label>Flat fee per withdrawal</label><input type="number" id="atm-fee" value="2" min="0" step="0.5"><span class="unit">EUR</span></div>

  <div class="divider"></div>
  <div class="results" id="results"></div>
  <div class="diff-bar" id="diff-note"></div>
  <p class="hint" id="revolut-hint"></p>
</div>

<script>
  const bankRateInput = document.getElementById('bank-rate');
  const bankRateUpdated = document.getElementById('bank-rate-updated');
  const refreshBankRateBtn = document.getElementById('refresh-bank-rate');

  ['euros','revolut-used','exchange-rate','bank-rate','atm-fee'].forEach(id =>
    document.getElementById(id).addEventListener('input', calc));

  function formatApiDate(dateString) {
    if (!dateString) return '-';
    const dt = new Date(`${dateString}T00:00:00`);
    if (Number.isNaN(dt.getTime())) return dateString;
    const day = dt.getDate();
    const month = dt.toLocaleString('en-GB', { month: 'short' });
    const year = dt.getFullYear();
    return `${day} ${month} ${year}`;
  }

  function formatQueryTime() {
    const dt = new Date();
    const day = String(dt.getDate()).padStart(2, '0');
    const month = String(dt.getMonth() + 1).padStart(2, '0');
    const year = dt.getFullYear();
    const hours = String(dt.getHours()).padStart(2, '0');
    const minutes = String(dt.getMinutes()).padStart(2, '0');
    const seconds = String(dt.getSeconds()).padStart(2, '0');
    return `${day}-${month}-${year} ${hours}:${minutes}:${seconds}`;
  }

  async function refreshBankRate() {
    refreshBankRateBtn.disabled = true;
    bankRateUpdated.textContent = 'Refreshing...';

    try {
      const response = await fetch('https://api.frankfurter.dev/v2/rate/EUR/ALL');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();
      if (typeof data.rate !== 'number') throw new Error('No rate in response');

      bankRateInput.value = data.rate.toFixed(2);
      bankRateUpdated.innerHTML = `Rate date: ${formatApiDate(data.date)}<br>Queried: ${formatQueryTime()}`;
      calc();
    } catch (error) {
      bankRateUpdated.innerHTML = `Update failed<br>Queried: ${formatQueryTime()}`;
    } finally {
      refreshBankRateBtn.disabled = false;
    }
  }

  refreshBankRateBtn.addEventListener('click', refreshBankRate);

  function calc() {
    const euros = parseFloat(document.getElementById('euros').value) || 0;
    const revUsed = parseFloat(document.getElementById('revolut-used').value) || 0;
    const exchRate = parseFloat(document.getElementById('exchange-rate').value) || 0;
    const midRate = parseFloat(document.getElementById('bank-rate').value) || 0;
    const atmFee = parseFloat(document.getElementById('atm-fee').value) || 0;

    const exchAll = euros * exchRate;

    const freeLeft = Math.max(0, 200 - revUsed);
    const paidPart = Math.max(0, euros - freeLeft);
    const revFee = paidPart * 0.02;
    const revAll = Math.max(0, euros - atmFee - revFee) * midRate;
    const revTotalFee = atmFee + revFee;

    const abnAtmFee = 1.50;
    const effectiveAbnRate = midRate * (1 - 0.012);
    const abnAll = Math.max(0, euros - atmFee - abnAtmFee) * effectiveAbnRate;

    const vals = [{key:'exchange',val:exchAll},{key:'revolut',val:revAll},{key:'abn',val:abnAll}];
    const winner = vals.reduce((a,b) => b.val > a.val ? b : a).key;
    const fmt = n => Math.round(n).toLocaleString();
    const fmtE = n => n.toFixed(2);

    document.getElementById('results').innerHTML = `
      <div class="result-card ${winner==='exchange'?'winner':''}">
        <div class="r-label">Exchange${winner==='exchange'?' <span class="badge">best</span>':''}</div>
        <div class="r-amount">${fmt(exchAll)} ALL</div>
        <div class="r-note">at ${exchRate} ALL/€<br>no fees</div>
      </div>
      <div class="result-card ${winner==='revolut'?'winner':''}">
        <div class="r-label">Revolut ATM${winner==='revolut'?' <span class="badge">best</span>':''}</div>
        <div class="r-amount">${fmt(revAll)} ALL</div>
        <div class="r-note">€${fmtE(revTotalFee)} total fees${revFee>0?' (incl. 2% on €'+fmtE(paidPart)+')':''}</div>
      </div>
      <div class="result-card ${winner==='abn'?'winner':''}">
        <div class="r-label">ABN AMRO ATM${winner==='abn'?' <span class="badge">best</span>':''}</div>
        <div class="r-amount">${fmt(abnAll)} ALL</div>
        <div class="r-note">€${fmtE(atmFee + abnAtmFee)} ATM fees + 1.2% FX</div>
      </div>`;

    const sorted = [...vals].sort((a,b) => b.val - a.val);
    const spread = sorted[0].val - sorted[sorted.length-1].val;
    const spreadPct = euros > 0 && midRate > 0 ? (spread / (euros * midRate) * 100) : 0;
    const names = {exchange:'Exchange office', revolut:'Revolut', abn:'ABN AMRO'};
    document.getElementById('diff-note').textContent = euros > 0 && midRate > 0
      ? `Best vs worst: ${fmt(spread)} ALL difference (${spreadPct.toFixed(1)}%) — ${names[sorted[0].key]} wins` : '';

    const hint = document.getElementById('revolut-hint');
    hint.textContent = revUsed >= 200
      ? `Revolut free limit reached — 2% fee applies to entire withdrawal`
      : freeLeft < euros
        ? `First €${fmtE(freeLeft)} free on Revolut, 2% on remaining €${fmtE(paidPart)}`
        : `Revolut free limit: €${fmtE(freeLeft)} remaining this month`;
  }
  calc();
  refreshBankRate();
</script>
</body>
</html>
